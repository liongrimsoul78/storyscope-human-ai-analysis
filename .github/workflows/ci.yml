name: Validation

on:
  push:
    branches:
      - main
      - feature/storyscope-v0.3.0-design
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python:
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Export tracked files without .git metadata
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p _export
          git -c core.autocrlf=false archive --format=tar HEAD | tar -x -C _export

      - name: Validate Feature Registry v0.1.2 against v0.1.1 baseline
        working-directory: _export
        run: >
          python validation/validate_feature_registry_v0_1_2.py
          --registry docs/design/v0.3.0/FEATURE_REGISTRY_v0.1.2-draft.json
          --baseline docs/design/v0.3.0/FEATURE_REGISTRY_v0.1.1_draft.json
          --verbose

      - name: Run Feature Registry v0.1.2 test suite
        working-directory: _export
        run: python -m unittest discover -s tests -p "test_feature_registry_v0_1_2.py" -v

      - name: Validate 30 features, options, directions, and gaps
        working-directory: _export
        run: python validation/validate_feature_map.py

      - name: Verify transcription against Table 16 source
        working-directory: _export
        run: python validation/check_source_table16.py

      - name: Verify SHA-256 manifest (strict, canonical Git export)
        working-directory: _export
        run: python validation/verify_manifest.py --strict

      - name: Run acceptance tests
        working-directory: _export
        run: python validation/test_acceptance.py
